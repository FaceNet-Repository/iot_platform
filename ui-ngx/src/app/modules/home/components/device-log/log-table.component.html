<mat-card>
  <!-- Thanh công cụ -->
  <div class="toolbar">
    <button mat-raised-button color="primary" (click)="toggleFilter()">
      <mat-icon>filter_alt</mat-icon> Filter
    </button>
  </div>

  <!-- Bộ lọc ẨN/HIỆN -->
  <div class="filter-container" *ngIf="showFilter">
    <mat-form-field appearance="outline">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" [(ngModel)]="startDate">
      <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" [(ngModel)]="endDate">
      <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="search-box">
      <mat-label>Search Content</mat-label>
      <input matInput [(ngModel)]="searchContent">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="accent" (click)="applyFilter()">
      <mat-icon>check</mat-icon> Apply
    </button>
  </div>

  <!-- Bảng dữ liệu -->
  <div class="table-container">
    <!-- Thanh tiêu đề bảng -->
    <div class="table-header">
      <div></div>
      <button mat-icon-button (click)="refreshData()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>

    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="timestamp">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Timestamp </th>
        <td mat-cell *matCellDef="let element"> {{ element.time | date:'yyyy-MM-dd HH:mm:ss' }} </td>
      </ng-container>

      <ng-container matColumnDef="entity_id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Entity ID </th>
        <td mat-cell *matCellDef="let element"> {{ element.entity_id }} </td>
      </ng-container>

      <ng-container matColumnDef="content">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Content </th>
        <td mat-cell *matCellDef="let element"> {{ element.content }} </td>
      </ng-container>

      <ng-container matColumnDef="function">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Function </th>
        <td mat-cell *matCellDef="let element"> {{ element.function }} </td>
      </ng-container>

      <ng-container matColumnDef="file">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> File </th>
        <td mat-cell *matCellDef="let element"> {{ element.file }} </td>
      </ng-container>

      <ng-container matColumnDef="line">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Line </th>
        <td mat-cell *matCellDef="let element"> {{ element.line }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Phân trang -->
  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</mat-card>
